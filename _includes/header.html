<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}" class="{% if active %}active{% endif %}">{{ item.title }}</a>
      {% endfor %}
      <a class="btn btn-small btn-dark" href="{{ '/feed.xml' | relative_url }}">订阅 RSS</a>
    </nav>
  </div>
</header>
